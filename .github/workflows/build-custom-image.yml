name: Build custom CIPP image

on:
  push:
    branches:
      - main
      - feature/gdap-accept-launcher
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "yarn.lock"
      - "next.config.js"
      - "staticwebapp.config.json"
      - "Dockerfile.custom"
      - ".github/workflows/build-custom-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-cipp-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read CIPP version
        id: version
        shell: bash
        run: echo "value=$(jq -r .version public/version.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.custom
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/acdxsec/cipp-custom:${{ steps.version.outputs.value }}-${{ github.run_number }}
            ghcr.io/acdxsec/cipp-custom:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/acdxsec/CIPP
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
